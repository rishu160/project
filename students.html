<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students – Amity University Raipur</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-menu-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <div>
          <div class="topbar-title">Student Management</div>
          <div class="topbar-subtitle">Manage all enrolled students</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn-custom btn-primary-custom" onclick="openModal()">
          <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline">Add Student</span>
        </button>
      </div>
    </div>

    <div class="page-content">
      <!-- Summary Cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card blue"><div class="stat-icon blue"><i class="bi bi-people-fill"></i></div><div class="stat-value" id="totalCount">0</div><div class="stat-label">Total Students</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card green"><div class="stat-icon green"><i class="bi bi-person-check-fill"></i></div><div class="stat-value" id="activeCount">0</div><div class="stat-label">Active</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card orange"><div class="stat-icon orange"><i class="bi bi-cash-coin"></i></div><div class="stat-value" id="pendingCount">0</div><div class="stat-label">Fees Pending</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card purple"><div class="stat-icon purple"><i class="bi bi-mortarboard-fill"></i></div><div class="stat-value" id="courseCount">0</div><div class="stat-label">Courses</div></div></div>
      </div>

      <div class="card-custom">
        <div class="card-header-custom2">
          <h5><i class="bi bi-table"></i>All Students</h5>
          <span class="badge-custom badge-primary" id="countBadge"></span>
        </div>
        <div class="card-body-custom">
          <div class="search-row">
            <div class="search-input-wrap">
              <i class="bi bi-search"></i>
              <input type="text" class="search-input" id="search" placeholder="Search by name, roll no, email..." oninput="render()">
            </div>
            <select class="filter-select" id="filterCourse" onchange="render()">
              <option value="">All Courses</option>
              <option>B.Tech CSE</option><option>B.Tech IT</option><option>B.Tech ME</option><option>B.Tech ECE</option>
            </select>
            <select class="filter-select" id="filterStatus" onchange="render()">
              <option value="">All Status</option>
              <option value="active">Active</option><option value="inactive">Inactive</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="table-custom">
              <thead>
                <tr><th>#</th><th>Student</th><th>Roll No</th><th>Course</th><th>Semester</th><th>Phone</th><th>Fees</th><th>Status</th><th>Actions</th></tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal-box">
    <div class="modal-header-custom">
      <h5 id="modalTitle"><i class="bi bi-person-plus-fill me-2"></i>Add Student</h5>
      <button class="modal-close-btn" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body-custom">
      <input type="hidden" id="fId">
      <div class="row g-3">
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Full Name *</label><input id="fName" class="form-control-inner" placeholder="Student full name"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Roll No *</label><input id="fRoll" class="form-control-inner" placeholder="e.g. CS2021001"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Email *</label><input id="fEmail" type="email" class="form-control-inner" placeholder="Email address"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Phone</label><input id="fPhone" class="form-control-inner" placeholder="10-digit number"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Course *</label>
          <select id="fCourse" class="form-control-inner"><option>B.Tech CSE</option><option>B.Tech IT</option><option>B.Tech ME</option><option>B.Tech ECE</option></select>
        </div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Semester *</label>
          <select id="fSem" class="form-control-inner"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
        </div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Date of Birth</label><input id="fDob" type="date" class="form-control-inner"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Fees Status</label>
          <select id="fFees" class="form-control-inner"><option value="paid">Paid</option><option value="pending">Pending</option></select>
        </div></div>
        <div class="col-12"><div class="form-group-custom"><label class="form-label-custom">Address</label><input id="fAddr" class="form-control-inner" placeholder="Full address"></div></div>
        <div class="col-12"><div class="form-group-custom"><label class="form-label-custom">Status</label>
          <select id="fStatus" class="form-control-inner"><option value="active">Active</option><option value="inactive">Inactive</option></select>
        </div></div>
      </div>
    </div>
    <div class="modal-footer-custom">
      <button class="btn-custom btn-outline-custom" onclick="closeModal()">Cancel</button>
      <button class="btn-custom btn-primary-custom" onclick="save()"><i class="bi bi-check-lg me-1"></i>Save Student</button>
    </div>
  </div>
</div>

<div class="toast-msg" id="toast"></div>
<script src="app.js"></script>
<script>
  const user = Auth.guard();
  document.getElementById('sidebar').innerHTML = renderSidebar('students');

  const avatarColors = ['#4f46e5','#10b981','#f59e0b','#ef4444','#3b82f6','#8b5cf6','#ec4899'];

  function getData() { return DB.get('students') || []; }

  function updateSummary() {
    const all = getData();
    document.getElementById('totalCount').textContent = all.length;
    document.getElementById('activeCount').textContent = all.filter(s=>s.status==='active').length;
    document.getElementById('pendingCount').textContent = all.filter(s=>s.fees==='pending').length;
    document.getElementById('courseCount').textContent = [...new Set(all.map(s=>s.course))].length;
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const fc = document.getElementById('filterCourse').value;
    const fs = document.getElementById('filterStatus').value;
    let data = getData().filter(s =>
      (!q || s.name.toLowerCase().includes(q) || s.rollNo.toLowerCase().includes(q) || s.email.toLowerCase().includes(q)) &&
      (!fc || s.course === fc) && (!fs || s.status === fs)
    );
    document.getElementById('countBadge').textContent = data.length + ' records';
    document.getElementById('tbody').innerHTML = data.map((s, i) => {
      const color = avatarColors[s.id % avatarColors.length];
      return `<tr>
        <td style="color:var(--text-muted);font-size:12px">${i+1}</td>
        <td>
          <div class="d-flex align-items-center gap-2">
            <div class="avatar-sm" style="background:${color}">${getInitials(s.name)}</div>
            <div><div style="font-weight:600;font-size:13px">${s.name}</div><div style="font-size:11px;color:var(--text-muted)">${s.email}</div></div>
          </div>
        </td>
        <td><span style="font-family:monospace;font-size:12px;font-weight:600;color:var(--primary)">${s.rollNo}</span></td>
        <td style="font-size:12px">${s.course}</td>
        <td><span class="badge-custom badge-secondary">Sem ${s.semester}</span></td>
        <td style="font-size:12px">${s.phone}</td>
        <td><span class="badge-custom ${s.fees==='paid'?'badge-success':'badge-warning'}">${s.fees==='paid'?'<i class="bi bi-check-circle-fill me-1"></i>':'<i class="bi bi-clock-fill me-1"></i>'}${s.fees}</span></td>
        <td><span class="badge-custom ${s.status==='active'?'badge-success':'badge-danger'}">${s.status}</span></td>
        <td>
          <div class="d-flex gap-1">
            <button class="btn-custom btn-outline-custom btn-sm-custom btn-icon" onclick="edit(${s.id})" title="Edit"><i class="bi bi-pencil-fill"></i></button>
            <button class="btn-custom btn-danger-custom btn-sm-custom btn-icon" onclick="del(${s.id})" title="Delete"><i class="bi bi-trash-fill"></i></button>
          </div>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="9" class="text-center py-5" style="color:var(--text-muted)"><i class="bi bi-inbox display-6 d-block mb-2"></i>No students found</td></tr>`;
    updateSummary();
  }

  function openModal(data = null) {
    document.getElementById('modalTitle').innerHTML = `<i class="bi bi-person-${data?'gear':'plus'}-fill me-2"></i>${data?'Edit':'Add'} Student`;
    document.getElementById('fId').value = data?.id || '';
    document.getElementById('fName').value = data?.name || '';
    document.getElementById('fRoll').value = data?.rollNo || '';
    document.getElementById('fEmail').value = data?.email || '';
    document.getElementById('fPhone').value = data?.phone || '';
    document.getElementById('fCourse').value = data?.course || 'B.Tech CSE';
    document.getElementById('fSem').value = data?.semester || '1';
    document.getElementById('fDob').value = data?.dob || '';
    document.getElementById('fAddr').value = data?.address || '';
    document.getElementById('fFees').value = data?.fees || 'paid';
    document.getElementById('fStatus').value = data?.status || 'active';
    document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() { document.getElementById('modal').classList.add('hidden'); }
  function edit(id) { openModal(getData().find(s => s.id === id)); }

  function save() {
    const name = document.getElementById('fName').value.trim();
    const rollNo = document.getElementById('fRoll').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    if (!name || !rollNo || !email) { toast('Please fill all required fields', 'error'); return; }
    const arr = getData();
    const id = document.getElementById('fId').value;
    const obj = { name, rollNo, email, phone: document.getElementById('fPhone').value,
      course: document.getElementById('fCourse').value, semester: +document.getElementById('fSem').value,
      dob: document.getElementById('fDob').value, address: document.getElementById('fAddr').value,
      fees: document.getElementById('fFees').value, status: document.getElementById('fStatus').value };
    if (id) { const idx = arr.findIndex(s=>s.id===+id); arr[idx]={...arr[idx],...obj}; toast('Student updated successfully!'); }
    else { arr.push({ id: genId(arr), ...obj }); toast('Student added successfully!'); }
    DB.set('students', arr); closeModal(); render();
  }

  function del(id) {
    if (!confirm('Are you sure you want to delete this student?')) return;
    DB.set('students', getData().filter(s=>s.id!==id));
    toast('Student deleted', 'error'); render();
  }

  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('show'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }

  render();
</script>
</body>
</html>
