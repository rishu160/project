<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty – Amity University Raipur</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-menu-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <div><div class="topbar-title">Faculty Management</div><div class="topbar-subtitle">Manage teaching staff</div></div>
      </div>
      <div class="topbar-right">
        <button class="btn-custom btn-primary-custom" onclick="openModal()">
          <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline">Add Faculty</span>
        </button>
      </div>
    </div>
    <div class="page-content">
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card blue"><div class="stat-icon blue"><i class="bi bi-person-workspace"></i></div><div class="stat-value" id="totalFac">0</div><div class="stat-label">Total Faculty</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card green"><div class="stat-icon green"><i class="bi bi-person-check-fill"></i></div><div class="stat-value" id="activeFac">0</div><div class="stat-label">Active</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card purple"><div class="stat-icon purple"><i class="bi bi-award-fill"></i></div><div class="stat-value" id="phdCount">0</div><div class="stat-label">Ph.D Holders</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card orange"><div class="stat-icon orange"><i class="bi bi-building-fill"></i></div><div class="stat-value" id="deptCount">0</div><div class="stat-label">Departments</div></div></div>
      </div>
      <div class="card-custom">
        <div class="card-header-custom2">
          <h5><i class="bi bi-table"></i>Faculty Members</h5>
          <span class="badge-custom badge-primary" id="countBadge"></span>
        </div>
        <div class="card-body-custom">
          <div class="search-row">
            <div class="search-input-wrap">
              <i class="bi bi-search"></i>
              <input type="text" class="search-input" id="search" placeholder="Search by name, subject..." oninput="render()">
            </div>
            <select class="filter-select" id="filterDept" onchange="render()">
              <option value="">All Departments</option>
              <option>Computer Science</option><option>Mathematics</option><option>Physics</option><option>Electronics</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="table-custom">
              <thead><tr><th>#</th><th>Faculty</th><th>Emp ID</th><th>Department</th><th>Subject</th><th>Qualification</th><th>Experience</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal-box">
    <div class="modal-header-custom">
      <h5 id="modalTitle"><i class="bi bi-person-plus-fill me-2"></i>Add Faculty</h5>
      <button class="modal-close-btn" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body-custom">
      <input type="hidden" id="fId">
      <div class="row g-3">
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Full Name *</label><input id="fName" class="form-control-inner" placeholder="Faculty name"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Employee ID *</label><input id="fEmpId" class="form-control-inner" placeholder="e.g. FAC006"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Email *</label><input id="fEmail" type="email" class="form-control-inner" placeholder="Email"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Phone</label><input id="fPhone" class="form-control-inner" placeholder="Phone number"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Department *</label>
          <select id="fDept" class="form-control-inner"><option>Computer Science</option><option>Mathematics</option><option>Physics</option><option>Electronics</option></select>
        </div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Subject *</label><input id="fSubject" class="form-control-inner" placeholder="Subject name"></div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Qualification</label>
          <select id="fQual" class="form-control-inner"><option>Ph.D</option><option>M.Tech</option><option>M.Sc</option><option>M.E</option></select>
        </div></div>
        <div class="col-6"><div class="form-group-custom"><label class="form-label-custom">Experience (years)</label><input id="fExp" type="number" min="0" class="form-control-inner" placeholder="Years of experience"></div></div>
        <div class="col-12"><div class="form-group-custom"><label class="form-label-custom">Status</label>
          <select id="fStatus" class="form-control-inner"><option value="active">Active</option><option value="inactive">Inactive</option></select>
        </div></div>
      </div>
    </div>
    <div class="modal-footer-custom">
      <button class="btn-custom btn-outline-custom" onclick="closeModal()">Cancel</button>
      <button class="btn-custom btn-primary-custom" onclick="save()"><i class="bi bi-check-lg me-1"></i>Save Faculty</button>
    </div>
  </div>
</div>

<div class="toast-msg" id="toast"></div>
<script src="app.js"></script>
<script>
  const user = Auth.guard();
  document.getElementById('sidebar').innerHTML = renderSidebar('faculty');
  const avatarColors = ['#4f46e5','#10b981','#f59e0b','#ef4444','#3b82f6','#8b5cf6'];

  function getData() { return DB.get('faculty') || []; }

  function updateSummary() {
    const all = getData();
    document.getElementById('totalFac').textContent = all.length;
    document.getElementById('activeFac').textContent = all.filter(f=>f.status==='active').length;
    document.getElementById('phdCount').textContent = all.filter(f=>f.qualification==='Ph.D').length;
    document.getElementById('deptCount').textContent = [...new Set(all.map(f=>f.dept))].length;
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const fd = document.getElementById('filterDept').value;
    let data = getData().filter(f =>
      (!q || f.name.toLowerCase().includes(q) || f.subject.toLowerCase().includes(q)) && (!fd || f.dept === fd)
    );
    document.getElementById('countBadge').textContent = data.length + ' records';
    document.getElementById('tbody').innerHTML = data.map((f, i) => `
      <tr>
        <td style="color:var(--text-muted);font-size:12px">${i+1}</td>
        <td>
          <div class="d-flex align-items-center gap-2">
            <div class="avatar-sm" style="background:${avatarColors[f.id%avatarColors.length]}">${getInitials(f.name)}</div>
            <div><div style="font-weight:600;font-size:13px">${f.name}</div><div style="font-size:11px;color:var(--text-muted)">${f.email}</div></div>
          </div>
        </td>
        <td><span style="font-family:monospace;font-size:12px;font-weight:600;color:var(--primary)">${f.empId}</span></td>
        <td style="font-size:12px">${f.dept}</td>
        <td style="font-size:12px">${f.subject}</td>
        <td><span class="badge-custom badge-info">${f.qualification}</span></td>
        <td style="font-size:12px">${f.experience} yrs</td>
        <td><span class="badge-custom ${f.status==='active'?'badge-success':'badge-danger'}">${f.status}</span></td>
        <td>
          <div class="d-flex gap-1">
            <button class="btn-custom btn-outline-custom btn-sm-custom btn-icon" onclick="edit(${f.id})"><i class="bi bi-pencil-fill"></i></button>
            <button class="btn-custom btn-danger-custom btn-sm-custom btn-icon" onclick="del(${f.id})"><i class="bi bi-trash-fill"></i></button>
          </div>
        </td>
      </tr>`).join('') || `<tr><td colspan="9" class="text-center py-5" style="color:var(--text-muted)"><i class="bi bi-inbox display-6 d-block mb-2"></i>No faculty found</td></tr>`;
    updateSummary();
  }

  function openModal(data=null) {
    document.getElementById('modalTitle').innerHTML = `<i class="bi bi-person-${data?'gear':'plus'}-fill me-2"></i>${data?'Edit':'Add'} Faculty`;
    document.getElementById('fId').value=data?.id||''; document.getElementById('fName').value=data?.name||'';
    document.getElementById('fEmpId').value=data?.empId||''; document.getElementById('fEmail').value=data?.email||'';
    document.getElementById('fPhone').value=data?.phone||''; document.getElementById('fDept').value=data?.dept||'Computer Science';
    document.getElementById('fSubject').value=data?.subject||''; document.getElementById('fQual').value=data?.qualification||'Ph.D';
    document.getElementById('fExp').value=data?.experience||''; document.getElementById('fStatus').value=data?.status||'active';
    document.getElementById('modal').classList.remove('hidden');
  }
  function closeModal() { document.getElementById('modal').classList.add('hidden'); }
  function edit(id) { openModal(getData().find(f=>f.id===id)); }

  function save() {
    const name=document.getElementById('fName').value.trim(), empId=document.getElementById('fEmpId').value.trim(), email=document.getElementById('fEmail').value.trim();
    if (!name||!empId||!email) { toast('Please fill all required fields','error'); return; }
    const arr=getData(), id=document.getElementById('fId').value;
    const obj={name,empId,email,phone:document.getElementById('fPhone').value,dept:document.getElementById('fDept').value,
      subject:document.getElementById('fSubject').value,qualification:document.getElementById('fQual').value,
      experience:+document.getElementById('fExp').value,status:document.getElementById('fStatus').value};
    if(id){const idx=arr.findIndex(f=>f.id===+id);arr[idx]={...arr[idx],...obj};toast('Faculty updated!');}
    else{arr.push({id:genId(arr),...obj});toast('Faculty added!');}
    DB.set('faculty',arr); closeModal(); render();
  }
  function del(id) {
    if(!confirm('Delete this faculty member?')) return;
    DB.set('faculty',getData().filter(f=>f.id!==id)); toast('Faculty deleted','error'); render();
  }
  function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('show');}
  function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show');}
  render();
</script>
</body>
</html>
