<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance – Amity University Raipur</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-menu-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <div><div class="topbar-title">Attendance Management</div><div class="topbar-subtitle">Track student attendance</div></div>
      </div>
    </div>
    <div class="page-content" id="pageContent"></div>
  </div>
</div>
<div class="toast-msg" id="toast"></div>
<script src="app.js"></script>
<script>
  const user = Auth.guard();
  document.getElementById('sidebar').innerHTML = renderSidebar('attendance');
  const students = DB.get('students')||[], courses = DB.get('courses')||[];
  function getAtt(){return DB.get('attendance')||[];}

  // ── ADMIN / FACULTY ──
  function renderMarkView() {
    const myCourses = user.role==='faculty' ? courses.filter(c=>c.faculty===user.name) : courses;
    document.getElementById('pageContent').innerHTML = `
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card blue"><div class="stat-icon blue"><i class="bi bi-calendar-check-fill"></i></div><div class="stat-value" id="totalRec">0</div><div class="stat-label">Total Records</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card green"><div class="stat-icon green"><i class="bi bi-person-check-fill"></i></div><div class="stat-value" id="presentRec">0</div><div class="stat-label">Present</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card red" style="--red:#ef4444"><div class="stat-icon red"><i class="bi bi-person-x-fill"></i></div><div class="stat-value" id="absentRec">0</div><div class="stat-label">Absent</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card orange"><div class="stat-icon orange"><i class="bi bi-percent"></i></div><div class="stat-value" id="avgPct">0%</div><div class="stat-label">Avg Attendance</div></div></div>
      </div>
      <div class="row g-3">
        <div class="col-lg-5">
          <div class="card-custom">
            <div class="card-header-custom2"><h5><i class="bi bi-pencil-square"></i>Mark Attendance</h5></div>
            <div class="card-body-custom">
              <div class="form-group-custom">
                <label class="form-label-custom">Select Course</label>
                <select id="selCourse" class="form-control-inner" onchange="loadStudents()">
                  ${myCourses.map(c=>`<option value="${c.id}">${c.code} – ${c.name}</option>`).join('')}
                </select>
              </div>
              <div class="form-group-custom">
                <label class="form-label-custom">Date</label>
                <input type="date" id="attDate" class="form-control-inner" value="${new Date().toISOString().split('T')[0]}" onchange="loadStudents()">
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span style="font-size:12px;font-weight:600;color:var(--text-muted)">STUDENTS</span>
                <div class="d-flex gap-2">
                  <button class="btn-custom btn-success-custom btn-sm-custom" onclick="markAll('present')"><i class="bi bi-check-all me-1"></i>All Present</button>
                  <button class="btn-custom btn-danger-custom btn-sm-custom" onclick="markAll('absent')"><i class="bi bi-x-lg me-1"></i>All Absent</button>
                </div>
              </div>
              <div id="attGrid" class="row g-2" style="max-height:320px;overflow-y:auto"></div>
              <button class="btn-custom btn-primary-custom w-100 mt-3" onclick="saveAttendance()">
                <i class="bi bi-save-fill me-2"></i>Save Attendance
              </button>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card-custom">
            <div class="card-header-custom2">
              <h5><i class="bi bi-bar-chart-fill"></i>Attendance Summary</h5>
              <select id="sumCourse" class="filter-select" onchange="renderSummary()">
                <option value="">All Courses</option>
                ${myCourses.map(c=>`<option value="${c.id}">${c.code}</option>`).join('')}
              </select>
            </div>
            <div class="card-body-custom p-0">
              <div class="table-wrap"><table class="table-custom" id="summaryTable">
                <thead><tr><th>Student</th><th>Roll No</th><th>Present</th><th>Absent</th><th>Attendance %</th></tr></thead>
                <tbody id="summaryBody"></tbody>
              </table></div>
            </div>
          </div>
        </div>
      </div>`;
    loadStudents(); renderSummary(); updateStats();
  }

  const attState = {};

  function loadStudents() {
    const courseId=+document.getElementById('selCourse').value;
    const course=courses.find(c=>c.id===courseId);
    const semStudents=students.filter(s=>s.semester===course?.semester&&s.status==='active');
    const date=document.getElementById('attDate').value;
    const existing=getAtt().filter(a=>a.courseId===courseId&&a.date===date);
    document.getElementById('attGrid').innerHTML=semStudents.map(s=>{
      const ex=existing.find(a=>a.studentId===s.id);
      const status=ex?.status||'present';
      attState[s.id]=status;
      return `<div class="col-6">
        <div class="att-student-card">
          <div class="s-name">${s.name}</div>
          <div class="s-roll">${s.rollNo}</div>
          <div class="att-toggle-btns">
            <button class="att-btn present ${status==='present'?'active':''}" onclick="toggleAtt(${s.id},'present',this)">✓ P</button>
            <button class="att-btn absent ${status==='absent'?'active':''}" onclick="toggleAtt(${s.id},'absent',this)">✗ A</button>
          </div>
        </div>
      </div>`;
    }).join('')||'<div class="col-12 text-center py-3" style="color:var(--text-muted);font-size:13px"><i class="bi bi-inbox me-2"></i>No students in this semester</div>';
  }

  function markAll(status) {
    Object.keys(attState).forEach(sid=>{ attState[sid]=status; });
    document.querySelectorAll('.att-btn').forEach(b=>{
      b.classList.remove('active');
      if(b.classList.contains(status)) b.classList.add('active');
    });
  }

  function toggleAtt(sid,status,el) {
    attState[sid]=status;
    el.closest('.att-toggle-btns').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
  }

  function saveAttendance() {
    const courseId=+document.getElementById('selCourse').value, date=document.getElementById('attDate').value;
    if(!date){toast('Please select a date','error');return;}
    let arr=getAtt().filter(a=>!(a.courseId===courseId&&a.date===date));
    Object.entries(attState).forEach(([sid,status])=>arr.push({id:genId(arr),studentId:+sid,courseId,date,status}));
    DB.set('attendance',arr); toast('Attendance saved successfully!'); renderSummary(); updateStats();
  }

  function updateStats() {
    const att=getAtt();
    const present=att.filter(a=>a.status==='present').length, absent=att.filter(a=>a.status==='absent').length;
    document.getElementById('totalRec').textContent=att.length;
    document.getElementById('presentRec').textContent=present;
    document.getElementById('absentRec').textContent=absent;
    document.getElementById('avgPct').textContent=att.length?Math.round(present/att.length*100)+'%':'0%';
  }

  function renderSummary() {
    const courseId=document.getElementById('sumCourse')?.value;
    let att=getAtt(); if(courseId) att=att.filter(a=>a.courseId===+courseId);
    const summary={};
    att.forEach(a=>{if(!summary[a.studentId])summary[a.studentId]={present:0,absent:0};summary[a.studentId][a.status]++;});
    document.getElementById('summaryBody').innerHTML=Object.entries(summary).map(([sid,s])=>{
      const st=students.find(x=>x.id===+sid), total=s.present+s.absent, pct=total?Math.round(s.present/total*100):0;
      return `<tr>
        <td><div class="d-flex align-items-center gap-2"><div class="avatar-sm" style="background:#4f46e5;width:28px;height:28px;font-size:10px">${getInitials(st?.name||'?')}</div><span style="font-size:13px;font-weight:600">${st?.name||'Unknown'}</span></div></td>
        <td style="font-size:12px;font-family:monospace">${st?.rollNo||''}</td>
        <td><span class="badge-custom badge-success">${s.present}</span></td>
        <td><span class="badge-custom badge-danger">${s.absent}</span></td>
        <td>
          <div class="d-flex align-items-center gap-2">
            <div class="progress-custom flex-1" style="min-width:80px"><div class="progress-bar-custom" style="width:${pct}%;background:${pct>=75?'#10b981':pct>=50?'#f59e0b':'#ef4444'}"></div></div>
            <span class="badge-custom ${pct>=75?'badge-success':pct>=50?'badge-warning':'badge-danger'}" style="min-width:44px;justify-content:center">${pct}%</span>
          </div>
        </td>
      </tr>`;
    }).join('')||'<tr><td colspan="5" class="text-center py-4" style="color:var(--text-muted)">No records found</td></tr>';
  }

  // ── STUDENT ──
  function renderStudentView() {
    const att=getAtt().filter(a=>a.studentId===user.id);
    const present=att.filter(a=>a.status==='present').length, absent=att.filter(a=>a.status==='absent').length;
    const pctOverall=att.length?Math.round(present/att.length*100):0;
    const myCourses=courses.filter(c=>c.semester===user.semester);
    document.getElementById('pageContent').innerHTML=`
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card blue"><div class="stat-icon blue"><i class="bi bi-book-fill"></i></div><div class="stat-value">${myCourses.length}</div><div class="stat-label">My Courses</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card green"><div class="stat-icon green"><i class="bi bi-check-circle-fill"></i></div><div class="stat-value">${present}</div><div class="stat-label">Present</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card red"><div class="stat-icon red"><i class="bi bi-x-circle-fill"></i></div><div class="stat-value">${absent}</div><div class="stat-label">Absent</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card ${pctOverall>=75?'green':'orange'}"><div class="stat-icon ${pctOverall>=75?'green':'orange'}"><i class="bi bi-percent"></i></div><div class="stat-value">${pctOverall}%</div><div class="stat-label">Overall</div></div></div>
      </div>
      <div class="row g-3 mb-3">
        ${myCourses.map(c=>{
          const cAtt=att.filter(a=>a.courseId===c.id);
          const cp=cAtt.filter(a=>a.status==='present').length, ca=cAtt.filter(a=>a.status==='absent').length;
          const pct=cAtt.length?Math.round(cp/cAtt.length*100):0;
          return `<div class="col-md-6"><div class="card-custom p-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div><div style="font-weight:700;font-size:13px">${c.code}</div><div style="font-size:12px;color:var(--text-muted)">${c.name}</div></div>
              <span class="badge-custom ${pct>=75?'badge-success':pct>=50?'badge-warning':'badge-danger'}">${pct}%</span>
            </div>
            <div class="progress-custom mb-2"><div class="progress-bar-custom" style="width:${pct}%;background:${pct>=75?'#10b981':pct>=50?'#f59e0b':'#ef4444'}"></div></div>
            <div class="d-flex gap-3" style="font-size:12px;color:var(--text-muted)">
              <span><i class="bi bi-check-circle-fill text-success me-1"></i>${cp} Present</span>
              <span><i class="bi bi-x-circle-fill text-danger me-1"></i>${ca} Absent</span>
            </div>
          </div></div>`;
        }).join('')}
      </div>
      <div class="card-custom">
        <div class="card-header-custom2"><h5><i class="bi bi-clock-history"></i>Attendance History</h5></div>
        <div class="card-body-custom p-0">
          <div class="table-wrap"><table class="table-custom">
            <thead><tr><th>Date</th><th>Course</th><th>Status</th></tr></thead>
            <tbody>${att.sort((a,b)=>b.date.localeCompare(a.date)).map(a=>{
              const c=courses.find(x=>x.id===a.courseId);
              return `<tr><td style="font-size:13px">${formatDate(a.date)}</td><td style="font-size:13px">${c?.code||''} – ${c?.name||'Unknown'}</td><td><span class="badge-custom ${a.status==='present'?'badge-success':'badge-danger'}"><i class="bi bi-${a.status==='present'?'check':'x'}-circle-fill me-1"></i>${a.status}</span></td></tr>`;
            }).join('')||'<tr><td colspan="3" class="text-center py-4" style="color:var(--text-muted)">No records</td></tr>'}</tbody>
          </table></div>
        </div>
      </div>`;
  }

  if(user.role==='student') renderStudentView(); else renderMarkView();
  function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('show');}
  function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show');}
</script>
</body>
</html>
